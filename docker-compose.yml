name: labelloop

services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: labelloop
      POSTGRES_PASSWORD: labelloop
      POSTGRES_DB: labelloop
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U labelloop -d labelloop"]
      interval: 3s
      timeout: 3s
      retries: 20

  backend:
    build: ./backend
    environment:
      DATABASE_URL: postgresql+psycopg://labelloop:labelloop@db:5432/labelloop
      DATA_DIR: /data
    volumes:
      - appdata:/data          # uploads, database-independent files, model weights + checkpoints
      - ./data:/app/data       # MinneApple prepared by scripts/ (for evaluation)
      - ./eval:/app/eval       # evaluation scripts, results land in eval/results
      - ./scripts:/app/scripts
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/api/health')"]
      interval: 5s
      timeout: 3s
      retries: 30
      start_period: 20s
    ports:
      - "8000:8000"   # API docs at http://localhost:8000/docs

  frontend:
    build: ./frontend
    depends_on:
      backend:
        condition: service_healthy
    ports:
      - "8080:80"     # app at http://localhost:8080

volumes:
  pgdata:
  appdata:
